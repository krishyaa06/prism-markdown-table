    <section class="grid g2 mt-io">
      <div class="card">
        <div class="card-title"><h2>Input</h2><div class="row"><span class="pill acc" id="fmt"></span><button class="btn small" id="sample">Sample</button></div></div>
        <textarea id="input" spellcheck="false" aria-label="Table input" placeholder="Paste CSV, TSV (from Excel/Sheets), JSON or a Markdown table"></textarea>
      </div>
      <div class="card">
        <div class="card-title"><div class="tabs" id="out"><button class="on" data-v="md">Markdown</button><button data-v="csv">CSV</button><button data-v="json">JSON</button><button data-v="html">HTML</button></div>
          <div class="row"><label class="check"><input type="checkbox" id="pretty" checked /> Align</label><button class="btn small primary" id="copy">Copy</button></div></div>
        <pre class="out res" id="res"></pre>
      </div>
    </section>
    <section class="card editor">
      <div class="card-title"><h2>Edit the table</h2><div class="row"><button class="btn small" id="addRow">+ Row</button><button class="btn small" id="addCol">+ Column</button><button class="btn small" id="tr">Transpose</button><button class="btn small ghost" id="clear">Clear</button></div></div>
      <div class="grid-wrap"><table class="edit" id="grid"></table></div>
      <p class="muted small">Click a header's arrows to set alignment or sort. Cells are editable.</p>
    </section>
